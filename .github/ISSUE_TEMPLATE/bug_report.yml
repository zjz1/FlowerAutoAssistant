name: Bug 报告
description: 报告可复现的问题（请先跑 --check-env，并附脱敏诊断包）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请：
        1. 运行 `backend\faa_webui.exe --check-env`（源码模式 `python webui.py --check-env`），失败项按建议处理后重试；
        2. 运行 `backend\faa_webui.exe --export-diag diag.zip` 导出**脱敏**诊断包（默认不含截图）；
        3. **不要**粘贴含账号、真实姓名、个人绝对路径或密钥的原始日志。
  - type: input
    id: version
    attributes:
      label: FAA 版本
      description: 发行包版本或 commit（如 v1.0.0 / 4f5b6cb）
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他（不受支持，仅供参考）
    validations:
      required: true
  - type: input
    id: mumu
    attributes:
      label: MuMu 模拟器版本与 ADB 地址
      placeholder: MuMu 12，127.0.0.1:16384
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 启动 ... 2. 勾选 ... 3. 点击 ... 4. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: checkenv
    attributes:
      label: 环境检查输出（可粘贴文本）
      render: text
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      description: 只贴出问题前后 20-50 行；账号请用 abc****de 占位
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不含账号、真实姓名、个人绝对路径、密钥等敏感信息
          required: true
